<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina — Intelligent Assistant</title>
  <link rel="stylesheet" href="/FRONTENDCSS.css" />
</head>
<body>
  <div class="app">

    <!-- HEADER -->
    <header>
      <div class="header-left">
        <h1>Lumi<em>na</em></h1>
        <div class="tagline">Emotionally Intelligent · Ethically Grounded</div>
      </div>
      <div class="header-right">
        <div class="status-dot" title="Online"></div>
        <button class="btn-reset" onclick="resetChat()">New chat</button>
      </div>
    </header>

    <!-- CHAT WINDOW -->
    <div class="chat-window" id="chatWindow">
      <div class="empty-state" id="emptyState">
        <div class="glyph">✦</div>
        <p>What's on your mind?</p>
        <div class="prompts">
          <button class="prompt-chip" onclick="quickPrompt(this)">Help me think through a problem</button>
          <button class="prompt-chip" onclick="quickPrompt(this)">I need honest advice</button>
          <button class="prompt-chip" onclick="quickPrompt(this)">Explain something complex simply</button>
          <button class="prompt-chip" onclick="quickPrompt(this)">I'm feeling overwhelmed</button>
        </div>
      </div>
    </div>

    <!-- INPUT AREA -->
    <div class="input-area">
      <div class="input-row">
        <textarea
          id="userInput"
          placeholder="Say anything…"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="btn-send" id="sendBtn" onclick="sendMessage()" title="Send">
          ↑
        </button>
      </div>
      <div class="input-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
    </div>

  </div>

  <script>
    const SESSION_ID = "session_" + Math.random().toString(36).slice(2, 10);
    let isLoading = false;

    /* ── helpers ── */
    function timestamp() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function autoResize(el) {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 140) + "px";
    }

    function scrollBottom() {
      const w = document.getElementById("chatWindow");
      w.scrollTo({ top: w.scrollHeight, behavior: "smooth" });
    }

    function hideEmpty() {
      const e = document.getElementById("emptyState");
      if (e) e.remove();
    }

    // Very light markdown: bold, italic, inline code, paragraphs
    function renderMarkdown(text) {
      return text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\n{2,}/g, "</p><p>")
        .replace(/\n/g, "<br>")
        .replace(/^/, "<p>").replace(/$/, "</p>");
    }

    // Simple heuristic: check if reply contains a correction/refusal pattern
    function isGuardianResponse(text) {
      const lc = text.toLowerCase();
      const triggers = [
        "that's not accurate", "that's incorrect", "this is false",
        "i need to correct", "this claim is", "this is misleading",
        "i can't help with", "i won't help with", "this crosses a line",
        "that's a conspiracy", "no evidence for", "factually wrong",
        "i must flag", "i should flag", "that's harmful"
      ];
      return triggers.some(t => lc.includes(t));
    }

    /* ── append message ── */
    function appendMessage(role, text) {
      hideEmpty();
      const w = document.getElementById("chatWindow");

      const wrap = document.createElement("div");
      wrap.className = `message ${role}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "U" : "✦";

      const inner = document.createElement("div");

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (role === "ai" && isGuardianResponse(text)) bubble.classList.add("guardian");
      bubble.innerHTML = renderMarkdown(text);

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = timestamp();

      inner.appendChild(bubble);
      inner.appendChild(meta);
      wrap.appendChild(avatar);
      wrap.appendChild(inner);
      w.appendChild(wrap);
      scrollBottom();
    }

    /* ── typing indicator ── */
    function showTyping() {
      hideEmpty();
      const w = document.getElementById("chatWindow");
      const wrap = document.createElement("div");
      wrap.className = "message ai";
      wrap.id = "typingMsg";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "✦";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = `<div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>`;

      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      w.appendChild(wrap);
      scrollBottom();
    }

    function removeTyping() {
      const t = document.getElementById("typingMsg");
      if (t) t.remove();
    }

    /* ── send ── */
    async function sendMessage() {
      if (isLoading) return;
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      input.style.height = "auto";
      document.getElementById("sendBtn").disabled = true;
      isLoading = true;

      appendMessage("user", text);
      showTyping();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: SESSION_ID, message: text })
        });

        const data = await res.json();
        removeTyping();

        if (data.error) {
          appendMessage("ai", "Something went wrong. Please try again.");
        } else {
          appendMessage("ai", data.reply);
        }
      } catch (err) {
        removeTyping();
        appendMessage("ai", "I couldn't reach the server. Check that the backend is running.");
      }

      isLoading = false;
      document.getElementById("sendBtn").disabled = false;
      input.focus();
    }

    /* ── enter key ── */
    function handleKey(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    /* ── quick prompts ── */
    function quickPrompt(btn) {
      const input = document.getElementById("userInput");
      input.value = btn.textContent;
      autoResize(input);
      input.focus();
    }

    /* ── reset ── */
    async function resetChat() {
      await fetch("/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: SESSION_ID })
      }).catch(() => {});

      const w = document.getElementById("chatWindow");
      w.innerHTML = `
        <div class="empty-state" id="emptyState">
          <div class="glyph">✦</div>
          <p>What's on your mind?</p>
          <div class="prompts">
            <button class="prompt-chip" onclick="quickPrompt(this)">Help me think through a problem</button>
            <button class="prompt-chip" onclick="quickPrompt(this)">I need honest advice</button>
            <button class="prompt-chip" onclick="quickPrompt(this)">Explain something complex simply</button>
            <button class="prompt-chip" onclick="quickPrompt(this)">I'm feeling overwhelmed</button>
          </div>
        </div>`;
    }
  </script>
</body>
</html>
